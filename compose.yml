services:
  db:
    image: postgres:17
    container_name: bank-db

    environment:
      POSTGRES_DB: bank_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - bank_data:/var/lib/postgresql/data
      # mount database folder to docker-entrypoint-initdb.d to initialize the database with scripts
      - ./database:/docker-entrypoint-initdb.d 

volumes:
  bank_data: